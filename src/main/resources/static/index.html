<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla CRUD</title>
    <!-- bootstrap cdn -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
    />
    <!-- alertifyjs CSS -->
    <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"
    />
    <!-- alertify Bootstrap theme -->
    <link
    rel="stylesheet"
    href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css"
    />
  </head>
  <body>

    <div class="container">

      
    
    <h1>Tabla CRUD</h1>
    
    <div class="container mt-4 shadow-lg p-3 mb-5 bg-body rounded">
      <!-- Button trigger modal -->
      <button
      id="btnCrear"
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      >
      Crear
      </button>
      <table
      id="tablaArticulos"
      class="table mt-2 table-bordered table-striped"
      >
        <thead>
          <tr class="text-center">
            <th>ID</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    
    <!-- Modal -->
    <div
    class="modal fade"
    id="modalArticulo"
    tabindex="-1"
    aria-labelledby="exampleModalLabel"
    aria-hidden="true"
    >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Producto</h1>
          <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="detail" class="col-form-label">Descripción: </label>
              <input type="text" class="form-control" id="detail" autofocus />
            </div>
            <div class="mb-3">
                <label for="price" class="col-form-label">Precio: </label>
                <input id="price" type="number" step="0.01" class="form-control" />
              </div>
              <div class="mb-3">
                <label for="stock" class="col-form-label">Stock: </label>
                <input id="stock" type="number" class="form-control" />
              </div>
            </div>
            <div class="modal-footer">
              <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              >
              Cerrar
            </button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
</div>
  
  <!-- bootstrap js -->
  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- alertifyjs plugin -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <!-- custom javascript -->
    <script src="./js/scrips.js"></script>
  </body>
  </html>
